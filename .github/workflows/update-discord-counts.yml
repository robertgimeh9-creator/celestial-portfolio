name: Update Discord member counts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch public Discord invite counts
        run: node .github/scripts/update-discord-counts.mjs

      - name: Commit refreshed counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discord-counts.json
          if git diff --cached --quiet; then
            echo "Discord member counts have not changed."
          else
            git commit -m "Update scheduled Discord member counts"
            git push
          fi
